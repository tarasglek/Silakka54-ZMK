name: Build

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "build.yaml"
      - "config/**"
      - "Makefile"
      - "module/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "build.yaml"
      - "config/**"
      - "Makefile"
      - "module/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run module host tests
        run: make test

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: |
            .west
            modules
            optional
            zephyr
            zmk
            tools
            .cache
          # Cache dependencies/compiler results, never snippet-bearing build trees.
          key: ${{ runner.os }}-zmk-deps-v2-${{ hashFiles('config/west.yml', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-zmk-deps-v2-

      - name: Build firmware
        run: make build

      - name: Fix workspace ownership for cache save
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            .west modules optional zephyr zmk tools build .cache artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: artifacts/*.uf2
